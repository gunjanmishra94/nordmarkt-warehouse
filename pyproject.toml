[project]
name = "nordmarkt-warehouse"
version = "0.1.0"
description = "Analytics warehouse for a fictional Berlin marketplace, built with dbt on DuckDB."
requires-python = ">=3.12"
dependencies = [
    "dbt-core>=1.8",
    "dbt-duckdb>=1.8",
    "dlt[duckdb]>=1.4",
    "pydantic>=2.7",
    "faker>=25.0",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "requests>=2.31",
]

[dependency-groups]
dev = [
    "pre-commit>=3.7",
    "ruff>=0.5",
    "sqlfluff>=3.0",
    "sqlfluff-templater-dbt>=3.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["generator", "pipeline"]
