nordmarkt:
  target: duckdb
  outputs:
    duckdb:
      type: duckdb
      path: data/nordmarkt.duckdb
      schema: main
      threads: 4
    motherduck:
      type: duckdb
      path: "md:{{ env_var('MOTHERDUCK_DATABASE', 'nordmarkt') }}?motherduck_token={{ env_var('MOTHERDUCK_TOKEN') }}"
      schema: main
      threads: 4
